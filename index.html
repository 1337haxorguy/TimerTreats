<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card">
        <!-- Top spacer (matches Figma "field" 60px height) -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="main-content">
          <!-- Title -->
          <div class="title-wrap">
            <p class="title"><em>timer<br>treats</em></p>
          </div>

          <!-- Subtitle -->
          <div class="subtitle-group">
            <div class="subtitle-line">
              <p>start a focus pomodoro timer to bake your treat.</p>
            </div>
            <div class="subtitle-line">
              <p>leave the site, and it burns!</p>
            </div>
          </div>

          <!-- Treat images — auto-scrolling marquee -->
          <div class="treats-row">
            <div class="treats-track">
              <!-- Set 1 -->
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/53aabce3-8625-40a2-9b18-eed52e72a32a" alt="sesame bun" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/7dab5931-39f4-4ff6-a8c4-9fb367d1b413" alt="matcha crepe cake" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/f7c88822-1818-4203-b673-3ff615ed11ce" alt="treat" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/ef1aec43-301d-486c-8ec2-0df9338426ce" alt="treat" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/5eabc987-22dd-4896-bc8f-f9b5ca1debae" alt="treat" />
              </div>
              <!-- Set 2 (duplicate for seamless loop) -->
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/53aabce3-8625-40a2-9b18-eed52e72a32a" alt="sesame bun" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/7dab5931-39f4-4ff6-a8c4-9fb367d1b413" alt="matcha crepe cake" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/f7c88822-1818-4203-b673-3ff615ed11ce" alt="treat" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/ef1aec43-301d-486c-8ec2-0df9338426ce" alt="treat" />
              </div>
              <div class="treat-item">
                <img src="https://www.figma.com/api/mcp/asset/5eabc987-22dd-4896-bc8f-f9b5ca1debae" alt="treat" />
              </div>
            </div>
          </div>
        </div>

        <!-- CTA Button -->
        <a href="#" class="btn-bake">
          <span class="btn-label">let's bake</span>
          <span class="btn-arrow">→</span>
        </a>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
