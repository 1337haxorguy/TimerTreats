<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card">
        <!-- Top spacer (matches Figma "field" 60px height) -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="main-content">

          <!-- Small brand label -->
          <p class="brand-label">Timer Treats</p>

          <!-- Hero: headline + overlapping treats -->
          <div class="splash-hero">
            <h1 class="splash-headline">Bake a sweet<br>treat and <em>focus</em></h1>

            <!-- Treat images — auto-scrolling marquee, overlaps headline -->
            <div class="treats-row">
              <div class="treats-track">
                <!-- Set 1 -->
                <div class="treat-item">
                  <img src="sesamebun.png" alt="sesame bun" />
                </div>
                <div class="treat-item">
                  <img src="matchacrepecake.png" alt="matcha crepe cake" />
                </div>
                <div class="treat-item">
                  <img src="strawberryswissroll.png" alt="strawberry swiss roll" />
                </div>
                <div class="treat-item">
                  <img src="turtlemelonbread.png" alt="turtle melon bread" />
                </div>
                <div class="treat-item">
                  <img src="thaiteatiramisu.png" alt="thai tea tiramisu" />
                </div>
                <div class="treat-item">
                  <img src="ube cookie.png" alt="ube cookie" />
                </div>
                <!-- Set 2 (duplicate for seamless loop) -->
                <div class="treat-item">
                  <img src="sesamebun.png" alt="sesame bun" />
                </div>
                <div class="treat-item">
                  <img src="matchacrepecake.png" alt="matcha crepe cake" />
                </div>
                <div class="treat-item">
                  <img src="strawberryswissroll.png" alt="strawberry swiss roll" />
                </div>
                <div class="treat-item">
                  <img src="turtlemelonbread.png" alt="turtle melon bread" />
                </div>
                <div class="treat-item">
                  <img src="thaiteatiramisu.png" alt="thai tea tiramisu" />
                </div>
                <div class="treat-item">
                  <img src="ube cookie.png" alt="ube cookie" />
                </div>
              </div>
            </div>
          </div>

          <!-- Subtitle -->
          <p class="splash-subtitle">Work on your to-dos with a pastry pomodoro timer! If you end the focus session, your treat will burn.</p>

        </div>

        <!-- CTA Button -->
        <a href="#" class="btn-bake">
          <span class="btn-label">let's bake</span>
          <span class="btn-arrow">→</span>
        </a>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
