<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card">
        <!-- Top spacer (matches Figma "field" 60px height) -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="main-content">
          <!-- Title -->
          <div class="title-wrap">
            <p class="title"><em>timer<br>treats</em></p>
          </div>

          <!-- Subtitle -->
          <div class="subtitle-group">
            <div class="subtitle-line">
              <p>start a focus pomodoro timer to bake your treat.</p>
            </div>
            <div class="subtitle-line">
              <p>leave the site, and it burns!</p>
            </div>
          </div>

          <!-- Treat images — auto-scrolling marquee -->
          <div class="treats-row">
            <div class="treats-track">
              <!-- Set 1 -->
              <div class="treat-item">
                <img src="sesamebun.png" alt="sesame bun" />
              </div>
              <div class="treat-item">
                <img src="matchacrepecake.png" alt="matcha crepe cake" />
              </div>
              <div class="treat-item">
                <img src="turtlemelonbread.png" alt="turtle melon bread" />
              </div>
              <div class="treat-item">
                <img src="thaiteatiramisu.png" alt="thai tea tiramisu" />
              </div>
              <div class="treat-item">
                <img src="ube cookie.png" alt="ube cookie" />
              </div>
              <!-- Set 2 (duplicate for seamless loop) -->
              <div class="treat-item">
                <img src="sesamebun.png" alt="sesame bun" />
              </div>
              <div class="treat-item">
                <img src="matchacrepecake.png" alt="matcha crepe cake" />
              </div>
              <div class="treat-item">
                <img src="turtlemelonbread.png" alt="turtle melon bread" />
              </div>
              <div class="treat-item">
                <img src="thaiteatiramisu.png" alt="thai tea tiramisu" />
              </div>
              <div class="treat-item">
                <img src="ube cookie.png" alt="ube cookie" />
              </div>
            </div>
          </div>
        </div>

        <!-- CTA Button -->
        <a href="#" class="btn-bake">
          <span class="btn-label">let's bake</span>
          <span class="btn-arrow">→</span>
        </a>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
