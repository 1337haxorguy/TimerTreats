<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats — What Are You Working On?</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card task-card">
        <!-- Top spacer -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="task-main">

          <!-- Back arrow -->
          <div class="sel-back">
            <button class="back-btn" aria-label="Go back">
              <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
          </div>

          <!-- Treat preview card -->
          <div class="task-treat-preview">
            <div class="task-treat-img-wrap">
              <img id="treatImg" src="" alt="" class="task-treat-img" />
            </div>
            <span id="treatName" class="task-treat-name">sesame bun</span>
            <span id="treatDuration" class="task-treat-duration">15 min</span>
          </div>

          <!-- Form section -->
          <div class="task-form">
            <h1 class="task-title">what are you working on?</h1>

            <div class="task-input-wrap">
              <input
                id="taskInput"
                class="task-input"
                type="text"
                placeholder="Code review..."
                maxlength="80"
                autocomplete="off"
              />
            </div>

            <div class="task-tags">
              <button class="task-tag" data-label="study session">study session</button>
              <button class="task-tag" data-label="work session">work session</button>
              <button class="task-tag" data-label="send emails">send emails</button>
              <button class="task-tag" data-label="exercise">exercise</button>
            </div>
          </div>

          <!-- Bottom actions: skip (empty state) / continue (filled state) -->
          <div class="task-actions">
            <button class="task-skip" id="skipBtn">skip and start baking <svg style="display:inline;vertical-align:middle;margin-left:2px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
            <button class="btn-bake task-continue hidden" id="continueBtn">
              <span class="btn-label">start baking</span>
              <svg class="task-continue-arrow" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="task.js"></script>
  </body>
</html>
