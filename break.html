<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats — Break Length</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card break-card">
        <!-- Top spacer -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="break-main">

          <!-- Back arrow -->
          <div class="sel-back">
            <button class="back-btn" aria-label="Go back">
              <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
          </div>

          <!-- Treat preview card -->
          <div class="task-treat-preview">
            <div class="task-treat-img-wrap">
              <img id="treatImg" src="" alt="" class="task-treat-img" />
            </div>
            <span id="treatName" class="task-treat-name">sesame bun</span>
            <span id="treatDuration" class="task-treat-duration">15 min</span>
          </div>

          <!-- Break length section -->
          <div class="break-form">
            <h1 class="break-title">break length</h1>

            <div class="break-stepper">
              <button class="stepper-btn" id="decrementBtn" aria-label="Decrease break length">
                <span class="stepper-symbol">−</span>
              </button>
              <span class="stepper-value" id="breakValue">5</span>
              <button class="stepper-btn" id="incrementBtn" aria-label="Increase break length">
                <span class="stepper-symbol">+</span>
              </button>
            </div>
          </div>

          <!-- Let's bake button -->
          <button class="btn-bake break-bake" id="bakeBtn">
            <span class="btn-label">let's bake</span>
            <svg class="task-continue-arrow" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>

    <script src="break.js"></script>
  </body>
</html>
