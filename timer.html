<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats — Baking...</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card timer-card">
        <!-- Top spacer -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="timer-main">

          <!-- Home link -->
          <button class="timer-home-btn" id="homeBtn" aria-label="Go home">
              <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            <span class="timer-home-label">home</span>
          </button>

          <!-- Centered content group -->
          <div class="timer-content">

            <!-- Baking illustration -->
            <div class="timer-illustration">
              <img
                src="baking_loading.png"
                alt="baking ingredients"
                class="timer-illustration-img"
              />
            </div>

            <!-- Countdown display -->
            <div class="timer-display">
              <span class="timer-value" id="timerValue">00:00</span>
            </div>

            <!-- Task chip -->
            <div class="timer-chip-wrap" id="chipWrap">
              <span class="task-tag selected timer-chip" id="taskChip"></span>
            </div>

            <!-- Copy -->
            <p class="timer-copy" id="timerCopy">your treat is in the oven...</p>

            <!-- Pause / Resume button -->
            <button class="timer-pause-btn" id="pauseBtn">
              <span class="btn-label" id="pauseLabel">pause</span>
              <svg class="timer-pause-icon" id="pauseIcon" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
              <span class="timer-play-icon hidden" id="playIcon">▶</span>
            </button>

          </div>
        </div>
      </div>
    </div>

    <script src="timer.js"></script>
  </body>
</html>
