<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats — Done!</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card done-card">
        <!-- Top spacer -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="done-main">

          <!-- Back arrow -->
          <div class="sel-back">
            <button class="back-btn" aria-label="Go back" id="backBtn">
              <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
          </div>

          <!-- Center content -->
          <div class="done-content">

            <!-- Title: "your [treat] is done!" with italic "done!" -->
            <h1 class="done-title">
              <span id="doneTitleText">your sesame bun is </span><em>done!</em>
            </h1>

            <!-- Treat illustration -->
            <div class="done-illustration">
              <img id="doneImg" src="" alt="" class="done-illustration-img" />
            </div>

            <!-- Session summary -->
            <div class="done-summary">
              <p class="done-summary-text">you worked on</p>
              <span class="task-tag selected done-chip" id="doneChip"></span>
              <p class="done-summary-text" id="doneMinutes">for 15 minutes</p>
            </div>

            <!-- CTAs -->
            <div class="done-actions">
              <button class="btn-bake done-primary" id="bakeAgainBtn">
                <span class="btn-label">bake another treat</span>
              </button>
              <button class="done-secondary" id="startOverBtn">
                <span>start over</span>
                <svg class="done-rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script src="done.js"></script>
  </body>
</html>
