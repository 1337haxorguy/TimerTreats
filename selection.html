<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer Treats — Choose Your Treat</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="screen">
      <div class="card selection-card">
        <!-- Top spacer -->
        <div class="top-field"></div>

        <!-- Main content -->
        <div class="sel-main">

          <!-- Back arrow -->
          <div class="sel-back">
            <button class="back-btn" aria-label="Go back">
              <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            </button>
          </div>

          <!-- Header -->
          <div class="sel-header">
            <h1 class="sel-title">choose your treat</h1>
            <p class="sel-subtitle">each pastry sets how long you'll focus.</p>
          </div>

          <!-- Treat grid -->
          <div class="treat-grid">
            <button
              class="treat-card"
              data-minutes="15"
              aria-label="sesame bun, 15 minutes"
            >
              <div class="treat-img-wrap">
                <img
                  src="sesamebun.png"
                  alt="sesame bun"
                  class="treat-img"
                />
              </div>
              <span class="treat-name">sesame bun</span>
              <span class="treat-duration">15 min</span>
            </button>

            <button
              class="treat-card"
              data-minutes="20"
              aria-label="ube cookie, 20 minutes"
            >
              <div class="treat-img-wrap">
                <img
                  src="ube cookie.png"
                  alt="ube cookie"
                  class="treat-img"
                />
              </div>
              <span class="treat-name">ube cookie</span>
              <span class="treat-duration">20 min</span>
            </button>

            <button
              class="treat-card"
              data-minutes="25"
              aria-label="strawberry swiss roll, 25 minutes"
            >
              <div class="treat-img-wrap">
                <img
                  src="strawberryswissroll.png"
                  alt="strawberry swiss roll"
                  class="treat-img"
                />
              </div>
              <span class="treat-name">strawberry swiss roll</span>
              <span class="treat-duration">25 min</span>
            </button>

            <button
              class="treat-card"
              data-minutes="30"
              aria-label="turtle melon bread, 30 minutes"
            >
              <div class="treat-img-wrap">
                <img
                  src="turtlemelonbread.png"
                  alt="turtle melon bread"
                  class="treat-img"
                />
              </div>
              <span class="treat-name">turtle melon bread</span>
              <span class="treat-duration">30 min</span>
            </button>

            <button
              class="treat-card"
              data-minutes="60"
              aria-label="matcha crepe cake, 1 hour"
            >
              <div class="treat-img-wrap">
                <img
                  src="matchacrepecake.png"
                  alt="matcha crepe cake"
                  class="treat-img"
                />
              </div>
              <span class="treat-name">matcha crepe cake</span>
              <span class="treat-duration">1 hour</span>
            </button>

            <button
              class="treat-card"
              data-minutes="120"
              aria-label="thai tea tiramisu, 2 hours"
            >
              <div class="treat-img-wrap">
                <img
                  src="thaiteatiramisu.png"
                  alt="thai tea tiramisu"
                  class="treat-img"
                />
              </div>
              <span class="treat-name">thai tea tiramisu</span>
              <span class="treat-duration">2 hours</span>
            </button>
          </div>

          <!-- CTA (disabled until a treat is selected) -->
          <button class="btn-bake btn-start" id="startBtn" disabled>
            <span class="btn-label">start baking</span>
            <span class="btn-arrow">→</span>
          </button>
        </div>
      </div>
    </div>

    <script src="selection.js"></script>
  </body>
</html>
